# PDF/EPUB 生成ワークフロー
# 手動トリガー（workflow_dispatch）でのみ実行され、各プロダクトの PDF と EPUB を
# 生成してアーティファクトとしてアップロードする。
name: Build PDF/EPUB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-formats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # astro 6.x が要求する Node.js >=22.12.0 を満たすため 22.12 系に固定
          # （パッチバージョンは自動追従、22.12.0 未満へのフォールバックを防ぐ）
          node-version: '22.12'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Build PDF and EPUB for all products
        run: npm run build:formats

      - name: Upload generated PDFs and EPUBs
        uses: actions/upload-artifact@v7
        with:
          name: vivliostyle-docs-formats
          path: public/downloads/
          if-no-files-found: error
