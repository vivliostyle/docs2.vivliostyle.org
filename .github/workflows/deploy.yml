# GitHub Pages デプロイ用ワークフロー
name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']  # 全ブランチでビルド可能
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      # PDF / EPUB / WebPub をビルド時に生成して dist/ に同梱する。
      # 成果物はリポジトリにはコミットせず（.gitignore で除外）、
      # 毎回のデプロイでこのステップが組版し直す。
      - name: Build PDF / EPUB / WebPub formats
        run: npm run build:formats

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    # mainブランチのみデプロイを実行
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
