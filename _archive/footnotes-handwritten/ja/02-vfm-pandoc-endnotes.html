<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>例 2: VFM Pandoc 形式の後注</title>
<style>
  @page { size: 140mm 90mm; margin: 12mm 14mm; }
  body {
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 10pt;
    line-height: 1.65;
    text-align: justify;
  }
  p { margin: 0 0 0.5em; }
  code { font-size: 0.92em; }
  sup a { text-decoration: none; font-size: 0.75em; vertical-align: super; line-height: 0; }
  /* VFM の Pandoc モードが生成する <section role="doc-endnotes"> 相当の体裁 */
  section[role="doc-endnotes"] {
    border-top: 0.4pt solid currentColor;
    margin-top: 1.2em;
    padding-top: 0.4em;
    font-size: 8.5pt;
    line-height: 1.5;
  }
  section[role="doc-endnotes"] ol { padding-left: 1.5em; margin: 0; }
  section[role="doc-endnotes"] li { margin: 0.1em 0; }
</style>
</head>
<body>
<p>VFM のデフォルト設定（<code>footnote: 'pandoc'</code>）では、<code>[^1]</code> 記法は <code>&lt;section role="doc-endnotes"&gt;</code> として本文末尾に追加される<sup id="fnref1"><a href="#fn1">1</a></sup>。</p>
<p>本文と通常フローでつながるため、<code>float: footnote</code> や <code>@page { @footnote { } }</code> の対象にならない<sup id="fnref2"><a href="#fn2">2</a></sup>点に注意。</p>
<section role="doc-endnotes">
  <ol>
    <li id="fn1">最初の後注の本文。<a href="#fnref1" aria-label="戻る">↩</a></li>
    <li id="fn2">次の後注の本文。<a href="#fnref2" aria-label="戻る">↩</a></li>
  </ol>
</section>
</body>
</html>
