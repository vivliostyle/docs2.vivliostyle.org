<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>例 6: footnote-display: compact</title>
<style>
  /* compact は 1 行に収まる短い注は inline、収まらない長い注は block に
     フォールバックする挙動 */
  @page {
    size: 140mm 90mm;
    margin: 12mm 14mm;
  }
  body {
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 10pt;
    line-height: 1.55;
  }
  p { margin: 0 0 0.5em; }
  code { font-size: 0.92em; }
  /* vivliostyle テスト dpub-footnote-display.html と同じパターン */
  .footnote-display-compact .footnote { footnote-display: compact; }
</style>
</head>
<body>
<section class="footnote-display-compact">
<p><code>footnote-display: compact</code> は、短い脚注はインライン<a id="ref1" href="#fn1" class="footnote-ref" role="doc-noteref"><sup>1</sup></a>でまとまって流れ<a id="ref2" href="#fn2" class="footnote-ref" role="doc-noteref"><sup>2</sup></a>、続く短い注も同じ行に並ぶ<a id="ref3" href="#fn3" class="footnote-ref" role="doc-noteref"><sup>3</sup></a>。一方で 1 行に収まらない長い注は自動でブロック扱いになる<a id="ref4" href="#fn4" class="footnote-ref" role="doc-noteref"><sup>4</sup></a>。</p>
<aside id="fn1" class="footnote" role="doc-footnote"><a href="#ref1" class="footnote-back" role="doc-backlink"><sup>1</sup></a>短い注。</aside>
<aside id="fn2" class="footnote" role="doc-footnote"><a href="#ref2" class="footnote-back" role="doc-backlink"><sup>2</sup></a>もう一つの短い注。</aside>
<aside id="fn3" class="footnote" role="doc-footnote"><a href="#ref3" class="footnote-back" role="doc-backlink"><sup>3</sup></a>別の短い注。</aside>
<aside id="fn4" class="footnote" role="doc-footnote"><a href="#ref4" class="footnote-back" role="doc-backlink"><sup>4</sup></a>こちらは 1 行に収まらない長めの注で、compact では自動的にブロック表示にフォールバックする挙動を確認する。</aside>
</section>
</body>
</html>
