<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>例 3: DPUB-ARIA 脚注（テーマ CSS なし、マーカー表示は最小限）</title>
<style>
  @page { size: 140mm 90mm; margin: 12mm 14mm; }
  body {
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 10pt;
    line-height: 1.65;
    text-align: justify;
  }
  p { margin: 0 0 0.5em; }
  code { font-size: 0.92em; }
  /* テーマ CSS や @footnote ルールは書かない。Vivliostyle.js v2.41.0+ の
     ビルトイン UA スタイルだけで脚注エリアへ自動 float することを確認する。
     ただし UA は DPUB-ARIA aside の ::footnote-marker content を空にして
     いるため、表示用に下記の 2 行のみ author で補う。Vivliostyle 仕様上、
     DPUB-ARIA のマーカー content は list-style-position: outside と組み
     合わせたときに描画される。 */
  aside[role="doc-footnote"] { margin-inline-start: 1.5em; }
  aside[role="doc-footnote"]::footnote-marker {
    content: counter(footnote) ".  ";
    list-style-position: outside;
  }
</style>
</head>
<body>
<p>本文中に <code>&lt;a role="doc-noteref"&gt;</code> で参照<a role="doc-noteref" href="#fn1">1</a>を入れ、別の場所に <code>&lt;aside role="doc-footnote"&gt;</code> を置く。</p>
<aside id="fn1" role="doc-footnote">脚注の本文。CSS は何も書いていない。</aside>
<p>Vivliostyle.js v2.41.0+ のビルトイン UA スタイルが <code>float: footnote</code> を自動で適用するため、テーマ CSS なしでもページ下部の脚注エリアに配置される<a role="doc-noteref" href="#fn2">2</a>。</p>
<aside id="fn2" role="doc-footnote">もう一つの注。連番は自動。</aside>
</body>
</html>
