<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>例 7: ::footnote-marker の list-style-position: outside</title>
<style>
  @page {
    size: 140mm 90mm;
    margin: 12mm 14mm;

    @footnote {
      border-top: 0.4pt solid currentColor;
      padding-top: 4pt;
      padding-left: 1.5em;
      font-size: 8.5pt;
      line-height: 1.5;
    }
  }
  body {
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 10pt;
    line-height: 1.65;
    text-align: justify;
  }
  p { margin: 0 0 0.5em; }
  code { font-size: 0.92em; }
  ::footnote-marker {
    content: counter(footnote) ". ";
    list-style-position: outside;
  }
</style>
</head>
<body>
<p><code>::footnote-marker</code> に <code>list-style-position: outside</code> を指定すると、マーカーが本文の外側に置かれる<a role="doc-noteref" href="#fn1">1</a>。</p>
<aside id="fn1" role="doc-footnote">この注の番号は、ぶら下げインデントで本文の左側に張り出して表示される。複数行に渡る場合の継続行は番号の下ではなく本文の左端に揃う。</aside>
<p>長い脚注の継続行が読みやすくなる<a role="doc-noteref" href="#fn2">2</a>のが利点。</p>
<aside id="fn2" role="doc-footnote">2 つめの注。同じくぶら下げインデント。</aside>
</body>
</html>
