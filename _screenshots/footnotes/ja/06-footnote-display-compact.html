<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>例 6: footnote-display: compact</title>
<style>
  @page {
    size: 140mm 90mm;
    margin: 12mm 14mm;

    @footnote {
      footnote-display: compact;
      border-top: 0.4pt solid currentColor;
      padding-top: 4pt;
      font-size: 8.5pt;
      line-height: 1.5;
    }
  }
  body {
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 10pt;
    line-height: 1.65;
    text-align: justify;
  }
  p { margin: 0 0 0.5em; }
  code { font-size: 0.92em; }
  ::footnote-marker { content: counter(footnote) "  "; }
</style>
</head>
<body>
<p><code>footnote-display: compact</code> では、短い脚注はインライン<a role="doc-noteref" href="#fn1">1</a>、長い脚注はブロック表示と、長さに応じて自動で切り替わる<a role="doc-noteref" href="#fn2">2</a>。</p>
<aside id="fn1" role="doc-footnote">短い注。</aside>
<aside id="fn2" role="doc-footnote">こちらは少し長めの注で、複数の文を含む。短い注と並んだときに改行されてブロックとして表示されることが分かる。</aside>
<p>3 つめの参照<a role="doc-noteref" href="#fn3">3</a>は短く、最初の注に並ぶ。</p>
<aside id="fn3" role="doc-footnote">短い注。</aside>
</body>
</html>
