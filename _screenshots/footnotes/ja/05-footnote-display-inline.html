<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>例 5: footnote-display: inline</title>
<style>
  @page {
    size: 140mm 90mm;
    margin: 12mm 14mm;

    @footnote {
      footnote-display: inline;
      border-top: 0.4pt solid currentColor;
      padding-top: 4pt;
      font-size: 8.5pt;
      line-height: 1.5;
    }
  }
  body {
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 10pt;
    line-height: 1.65;
    text-align: justify;
  }
  p { margin: 0 0 0.5em; }
  code { font-size: 0.92em; }
  ::footnote-marker { content: counter(footnote) "  "; }
</style>
</head>
<body>
<p><code>footnote-display: inline</code> を指定すると、複数の脚注が同じ行に流れ込む<a role="doc-noteref" href="#fn1">1</a>。</p>
<aside id="fn1" role="doc-footnote">短い注。</aside>
<p>本文中の参照を 3 つ並べた場合<a role="doc-noteref" href="#fn2">2</a>でも、脚注エリアの縦方向のスペース消費が抑えられる<a role="doc-noteref" href="#fn3">3</a>。</p>
<aside id="fn2" role="doc-footnote">もう一つの短い注。</aside>
<aside id="fn3" role="doc-footnote">別の短い注。</aside>
</body>
</html>
