<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example 5: footnote-display: inline</title>
<style>
  @page {
    size: 140mm 90mm;
    margin: 12mm 14mm;

    @footnote {
      footnote-display: inline;
      border-top: 0.4pt solid currentColor;
      padding-top: 4pt;
      font-size: 8.5pt;
      line-height: 1.5;
    }
  }
  body {
    font-family: "Source Serif Pro", "Georgia", serif;
    font-size: 10pt;
    line-height: 1.55;
    text-align: justify;
  }
  p { margin: 0 0 0.5em; }
  code { font-size: 0.92em; }
  ::footnote-marker { content: counter(footnote) ".  "; }
</style>
</head>
<body>
<p>With <code>footnote-display: inline</code>, multiple footnotes flow on the same line<a role="doc-noteref" href="#fn1">1</a>.</p>
<aside id="fn1" role="doc-footnote">A short note.</aside>
<p>Three short references<a role="doc-noteref" href="#fn2">2</a> in a row<a role="doc-noteref" href="#fn3">3</a> still keep the footnote area compact in the vertical direction.</p>
<aside id="fn2" role="doc-footnote">Another short note.</aside>
<aside id="fn3" role="doc-footnote">A third short note.</aside>
</body>
</html>
