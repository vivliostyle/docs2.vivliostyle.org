<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example 4: Custom styling via @page { @footnote { … } }</title>
<style>
  @page {
    size: 140mm 90mm;
    margin: 12mm 14mm;

    @footnote {
      border-top: 1pt solid #555;
      padding-top: 6pt;
      margin-top: 6pt;
      font-size: 8.5pt;
      line-height: 1.5;
      color: #333;
    }
    @footnote::before {
      content: "Notes";
      display: block;
      font-weight: 600;
      margin-bottom: 0.2em;
      color: #555;
    }
  }
  body {
    font-family: "Source Serif Pro", "Georgia", serif;
    font-size: 10pt;
    line-height: 1.55;
    text-align: justify;
  }
  p { margin: 0 0 0.5em; }
  code { font-size: 0.92em; }
</style>
</head>
<body>
<p>This example styles the footnote area with <code>@page { @footnote { … } }</code><a role="doc-noteref" href="#fn1">1</a>, applying a top border, padding, and a generated "Notes" heading via <code>::before</code>.</p>
<aside id="fn1" role="doc-footnote">A styled footnote.</aside>
<p>With multiple notes<a role="doc-noteref" href="#fn2">2</a>, the heading appears once for the entire footnote area, not per note.</p>
<aside id="fn2" role="doc-footnote">A second styled footnote.</aside>
</body>
</html>
